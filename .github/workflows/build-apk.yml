
name: Build MotoDashcam APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MotoDashcam_Android_Project_v1_1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -o MotoDashcam_Android_Project_v1_1.zip -d source
          find source -type f -name gradlew

      - name: Build APK
        run: |
          cd source/MotoDashcam
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoDashcam-APK
          path: source/MotoDashcam/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
