name: Build MotoDashcam APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MotoDashcam_Android_Project_v1_1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir source
          unzip -o MotoDashcam_Android_Project_v1_1.zip -d source
          find source -type f | head -80
          find source -name gradlew -type f

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source/MotoDashcam
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoDashcam-APK
          path: source/MotoDashcam/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
